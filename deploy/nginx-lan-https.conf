server {
    listen 80;
    server_name _;
    location = /install.html {
        alias /certificates/install.html;
        default_type text/html;
        charset utf-8;
    }
    location ^~ /downloads/ {
        alias /certificates/downloads/;
        types { application/vnd.android.package-archive apk; application/octet-stream exe; text/plain txt; }
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /tool-tracker-root-ca.crt {
        alias /certificates/tool-tracker-root-ca.crt;
        default_type application/x-x509-ca-cert;
    }
    location = /tool-tracker-root-ca.cer {
        alias /certificates/tool-tracker-root-ca.cer;
        default_type application/x-x509-ca-cert;
    }
    location = /tool-tracker-lan.mobileconfig {
        alias /certificates/tool-tracker-lan.mobileconfig;
        default_type application/x-apple-aspen-config;
    }
    location / {
        return 308 https://tools.192.168.0.116.sslip.io:8444$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name tools.192.168.0.116.sslip.io;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m; # work-log and problem photos (up to 3, sent as data URLs)
    location ^~ /downloads/ {
        alias /certificates/downloads/;
        types { application/vnd.android.package-archive apk; application/octet-stream exe; text/plain txt; }
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff always;
    }

    if ($host != tools.192.168.0.116.sslip.io) {
        return 308 https://tools.192.168.0.116.sslip.io:8444$request_uri;
    }
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
